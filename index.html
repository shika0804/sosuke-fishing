<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0066cc">

<title>そうすけの大漁チャレンジ</title>

<style>

html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    touch-action:none;
    font-family:sans-serif;
    background:#000;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#bg{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

#player{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    width:90px;
    height:90px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:70px;
    z-index:50;
    transition:transform 0.15s ease;
    filter:drop-shadow(2px 2px 4px rgba(0,0,0,0.6));
}

@keyframes catchFish{
    0%{
        transform:translateX(-50%) rotate(0deg);
    }
    50%{
        transform:translateX(-50%) rotate(-25deg);
    }
    100%{
        transform:translateX(-50%) rotate(0deg);
    }
}

.item{
    position:absolute;
    font-size:48px;
    user-select:none;
    z-index:40;
}

#score{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:32px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
    z-index:100;
}

#high{
    position:absolute;
    top:55px;
    left:15px;
    color:gold;
    font-size:20px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
    z-index:100;
}

#timer{
    position:absolute;
    top:15px;
    right:15px;
    color:white;
    font-size:32px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
    z-index:100;
}

#startScreen{
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.55);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
    z-index:200;
}

button{
    font-size:24px;
    padding:14px 28px;
    border:none;
    border-radius:14px;
}

h1{
    text-align:center;
}

</style>
</head>
<body>

<div id="game">

<img id="bg" src="family.jpg">

<div id="score">🐟 0</div>
<div id="high"></div>
<div id="timer">30</div>

<div id="player">🎣</div>

<div id="startScreen">

<h1>そうすけの大漁チャレンジ</h1>

<p>魚を集めよう！</p>
<p>カニは減点！</p>
<p>タップした場所へ移動！</p>

<button onclick="startGame()">
スタート
</button>

</div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const timerText = document.getElementById("timer");
const highText = document.getElementById("high");

let score = 0;
let time = 30;
let running = false;

let spawnInterval;
let timerInterval;

let highScore =
parseInt(localStorage.getItem("sosukeHigh") || "0");

highText.innerText =
"🏆 " + highScore;

function updateScore(){
    scoreText.innerText =
    "🐟 " + score;
}

game.addEventListener("touchstart",(e)=>{

    if(!running) return;

    const x =
    e.touches[0].clientX;

    player.style.left = x + "px";
});

game.addEventListener("click",(e)=>{

    if(!running) return;

    player.style.left =
    e.clientX + "px";
});

function createItem(){

    const item =
    document.createElement("div");

    item.className = "item";

    let type;

    if(score > 0 && score % 10 === 0 && Math.random() < 0.25){

        type = "boss";
        item.innerHTML = "🐋";

    }else{

        const r = Math.random();

        if(r < 0.75){

            const fishes = [
            "🐟",
            "🐠",
            "🐡",
            "🦑"
            ];

            item.innerHTML =
            fishes[
            Math.floor(Math.random()*fishes.length)
            ];

            type = "fish";

        }else{

            item.innerHTML = "🦀";
            type = "crab";
        }
    }

    item.dataset.type = type;

    item.style.left =
    Math.random() *
    (window.innerWidth - 60)
    + "px";

    item.style.top = "-80px";

    game.appendChild(item);

    let y = -80;

    const speed =
    3 + Math.random()*4;

    const move =
    setInterval(()=>{

        if(!running){
            clearInterval(move);
            item.remove();
            return;
        }

        y += speed;

        item.style.top =
        y + "px";

       function checkCollision(item,move){

    const a=item.getBoundingClientRect();
    const b=player.getBoundingClientRect();

    if(
        a.left<b.right &&
        a.right>b.left &&
        a.top<b.bottom &&
        a.bottom>b.top
    ){

        const type=item.dataset.type;

        if(type==="fish"){

            score+=1;

            player.style.animation="catchFish 0.15s ease";

            setTimeout(()=>{
                player.style.animation="";
            },150);

            if(navigator.vibrate){
                navigator.vibrate(30);
            }

        }else if(type==="crab"){

            score=Math.max(0,score-3);

            if(navigator.vibrate){
                navigator.vibrate([30,30,30]);
            }

        }else if(type==="boss"){

            score+=5;

            player.style.animation="catchFish 0.25s ease";

            setTimeout(()=>{
                player.style.animation="";
            },250);

            if(navigator.vibrate){
                navigator.vibrate(150);
            }
        }

        updateScore();

        clearInterval(move);

        item.remove();
    }
}

    },16);
}

function checkCollision(
item,
move
){

    const a =
    item.getBoundingClientRect();

    const b =
    player.getBoundingClientRect();

    if(
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
    ){

        const type =
        item.dataset.type;

        if(type==="fish"){

            score += 1;

        }else if(type==="crab"){

            score =
            Math.max(
            0,
            score - 3
            );

        }else if(type==="boss"){

            score += 5;
        }

        updateScore();

        if(navigator.vibrate){
            navigator.vibrate(50);
        }

        clearInterval(move);
        item.remove();
    }
}

function startGame(){

    document
    .getElementById(
    "startScreen"
    )
    .style.display = "none";

    score = 0;
    time = 30;

    updateScore();

    timerText.innerText =
    time;

    running = true;

    spawnInterval =
    setInterval(
    createItem,
    700
    );

    timerInterval =
    setInterval(()=>{

        time--;

        timerText.innerText =
        time;

        if(time<=0){

            endGame();
        }

    },1000);
}

function endGame(){

    running = false;

    clearInterval(
    spawnInterval
    );

    clearInterval(
    timerInterval
    );

    if(score > highScore){

        highScore = score;

        localStorage.setItem(
        "sosukeHigh",
        highScore
        );
    }

    highText.innerText =
    "🏆 " + highScore;

    const title =
    document.querySelector(
    "#startScreen h1"
    );

    title.innerHTML =
    "終了！<br>" +
    score +
    "ポイント";

    document
    .getElementById(
    "startScreen"
    )
    .style.display =
    "flex";
}

</script>

</body>
</html>
