<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>そうすけの大漁チャレンジ</title>

<style>

html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    touch-action:none;
    font-family:sans-serif;
    background:black;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#bg{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

#player{

    position:absolute;

    left:42%;
    bottom:120px;

    width:110px;
    height:150px;

    border-radius:50%;
}

.fish{

    position:absolute;

    font-size:60px;

    filter:
    drop-shadow(2px 2px 2px black);

    user-select:none;
}

.bomb{

    position:absolute;

    font-size:55px;

    user-select:none;
}

#score{

    position:absolute;

    top:15px;
    left:15px;

    color:white;

    font-size:32px;

    font-weight:bold;

    text-shadow:
    2px 2px 5px black;

    z-index:100;
}

#high{

    position:absolute;

    top:55px;
    left:15px;

    color:gold;

    font-size:20px;

    font-weight:bold;

    text-shadow:
    2px 2px 5px black;

    z-index:100;
}

#timer{

    position:absolute;

    top:15px;
    right:15px;

    color:white;

    font-size:32px;

    font-weight:bold;

    text-shadow:
    2px 2px 5px black;

    z-index:100;
}

#startScreen{

    position:absolute;

    width:100%;
    height:100%;

    background:
    rgba(0,0,0,0.5);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:white;

    z-index:200;
}

button{

    font-size:28px;

    padding:15px 35px;

    border:none;

    border-radius:15px;
}

</style>
</head>

<body>

<div id="game">

<img id="bg" src="family.jpg">

<div id="score">🐟 0</div>

<div id="high"></div>

<div id="timer">30</div>

<div id="player"></div>

<div id="startScreen">

<h1>そうすけの大漁チャレンジ</h1>

<p>タップでジャンプ！</p>

<p>魚を集めよう！</p>

<p>💣は危険！</p>

<button onclick="startGame()">
スタート
</button>

</div>

</div>

<script>

const player =
document.getElementById("player");

const game =
document.getElementById("game");

const scoreText =
document.getElementById("score");

const timerText =
document.getElementById("timer");

const highText =
document.getElementById("high");

let score=0;
let time=30;

let y=120;
let velocity=0;
let jumping=false;

let gameRunning=false;

let fishSpawner;
let bombSpawner;
let timerInterval;

let highScore =
localStorage.getItem("sosukeHigh") || 0;

highText.innerText =
"🏆 " + highScore;

function jump(){

    if(!gameRunning) return;

    if(!jumping){

        velocity=18;
        jumping=true;

    }
}

document.addEventListener(
"touchstart",
jump
);

document.addEventListener(
"click",
jump
);

function update(){

    velocity-=0.9;

    y+=velocity;

    if(y<120){

        y=120;

        velocity=0;

        jumping=false;
    }

    player.style.bottom =
    y+"px";

    requestAnimationFrame(update);
}

update();

function spawnFish(){

    const fish =
    document.createElement("div");

    fish.className="fish";

    fish.innerHTML="🐟";

    fish.style.left="-100px";

    fish.style.top=
    (100+
    Math.random()*450)
    +"px";

    game.appendChild(fish);

    let x=-100;

    let speed=
    4+
    Math.random()*5;

    const move=
    setInterval(()=>{

        x+=speed;

        fish.style.left=
        x+"px";

        hitCheck(
        fish,
        move,
        true
        );

        if(
        x>
        window.innerWidth+100
        ){
            fish.remove();
            clearInterval(move);
        }

    },16);
}

function spawnBomb(){

    const bomb=
    document.createElement("div");

    bomb.className="bomb";

    bomb.innerHTML="🦀";

    bomb.style.left=
    window.innerWidth+"px";

    bomb.style.top=
    (150+
    Math.random()*400)
    +"px";

    game.appendChild(bomb);

    let x=
    window.innerWidth;

    let speed=
    5+
    Math.random()*4;

    const move=
    setInterval(()=>{

        x-=speed;

        bomb.style.left=
        x+"px";

        hitCheck(
        bomb,
        move,
        false
        );

        if(x<-100){

            bomb.remove();

            clearInterval(move);
        }

    },16);
}

function hitCheck(
obj,
interval,
isFish
){

    const r1=
    obj.getBoundingClientRect();

    const r2=
    player.getBoundingClientRect();

    if(
    r1.left<r2.right &&
    r1.right>r2.left &&
    r1.top<r2.bottom &&
    r1.bottom>r2.top
    ){

        if(isFish){

            score++;

        }else{

            score=
            Math.max(
            0,
            score-3
            );
        }

        scoreText.innerText=
        "🐟 "+score;

        obj.remove();

        clearInterval(interval);
    }
}

function startGame(){

    document
    .getElementById(
    "startScreen"
    )
    .style.display="none";

    score=0;

    time=30;

    gameRunning=true;

    scoreText.innerText=
    "🐟 0";

    timerText.innerText=
    "30";

    fishSpawner=
    setInterval(
    spawnFish,
    900
    );

    bombSpawner=
    setInterval(
    spawnBomb,
    2500
    );

    timerInterval=
    setInterval(()=>{

        time--;

        timerText.innerText=
        time;

        if(time<=0){

            endGame();

        }

    },1000);
}

function endGame(){

    gameRunning=false;

    clearInterval(
    fishSpawner
    );

    clearInterval(
    bombSpawner
    );

    clearInterval(
    timerInterval
    );

    if(score>highScore){

        highScore=score;

        localStorage.setItem(
        "sosukeHigh",
        score
        );
    }

    highText.innerText=
    "🏆 "+highScore;

    setTimeout(()=>{

        document
        .getElementById(
        "startScreen"
        )
        .style.display=
        "flex";

        document
        .querySelector(
        "#startScreen h1"
        )
        .innerHTML=
        "終了！<br>" +
        score +
        "匹ゲット！";

    },500);
}

</script>

</body>
</html>
