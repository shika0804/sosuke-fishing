<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0066cc">
<title>そうすけの大漁チャレンジ</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:sans-serif;touch-action:none}
#game{position:relative;width:100vw;height:100vh;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#score,#timer,#high{position:absolute;z-index:100;color:#fff;font-weight:bold;text-shadow:2px 2px 4px #000}
#score{top:15px;left:15px;font-size:30px}
#high{top:55px;left:15px;color:gold}
#timer{top:15px;right:15px;font-size:30px}
#player{
 position:absolute;bottom:40px;left:50%;
 transform:translateX(-50%);
 font-size:76px;z-index:50;
 transition:transform .15s ease;
 filter:drop-shadow(2px 2px 4px rgba(0,0,0,.6));
}
.item{position:absolute;z-index:40;user-select:none}
#startScreen{
 position:absolute;inset:0;z-index:200;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 text-align:center;color:white;
 background:rgba(0,0,0,.55);
}
button{font-size:24px;padding:14px 28px;border:none;border-radius:12px}
@keyframes catchFish{
0%{transform:translateX(-50%) rotate(0)}
50%{transform:translateX(-50%) rotate(-25deg)}
100%{transform:translateX(-50%) rotate(0)}
}
</style>
</head>
<body>
<div id="game">
<img id="bg" src="family.jpg">
<div id="score">🐟 0</div>
<div id="high"></div>
<div id="timer">30</div>
<div id="player">🎣</div>

<div id="startScreen">
<h1>そうすけの大漁チャレンジ</h1>
<p>タップした場所へ釣り竿を移動！</p>
<p>🐟 +1　🦀 -3　🐋 +5</p>
<button onclick="startGame()">スタート</button>
</div>
</div>

<script>
const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreText=document.getElementById("score");
const timerText=document.getElementById("timer");
const highText=document.getElementById("high");

let score=0,time=30,running=false;
let spawnInterval,timerInterval;

let highScore=parseInt(localStorage.getItem("sosukeHigh")||"0");
highText.textContent="🏆 "+highScore;

function updateScore(){
 scoreText.textContent="🐟 "+score;
}

function moveRod(x){
 player.style.left=x+"px";
}

game.addEventListener("touchstart",e=>{
 if(!running)return;
 moveRod(e.touches[0].clientX);
},{passive:true});

game.addEventListener("click",e=>{
 if(!running)return;
 moveRod(e.clientX);
});

function animateRod(ms){
 player.style.animation=`catchFish ${ms}ms ease`;
 setTimeout(()=>player.style.animation="",ms);
}

function spawnItem(){
 const item=document.createElement("div");
 item.className="item";

 let type;
 const r=Math.random();

 if(score>0 && score%10===0 && r<0.20){
   type="boss";
   item.textContent="🐋";
   item.style.fontSize="72px";
 }else if(r<0.75){
   type="fish";
   const fish=["🐟","🐠","🐡","🦑"];
   item.textContent=fish[Math.floor(Math.random()*fish.length)];
   item.style.fontSize="52px";
 }else{
   type="crab";
   item.textContent="🦀";
   item.style.fontSize="52px";
 }

 item.dataset.type=type;
 item.style.left=Math.random()*(window.innerWidth-80)+"px";
 item.style.top="-80px";
 game.appendChild(item);

 let y=-80;
 const speed=3+Math.random()*4;

 const loop=setInterval(()=>{
   if(!running){
      clearInterval(loop);
      item.remove();
      return;
   }

   y+=speed;
   item.style.top=y+"px";

   const a=item.getBoundingClientRect();
   const b=player.getBoundingClientRect();

   if(a.left<b.right && a.right>b.left &&
      a.top<b.bottom && a.bottom>b.top){

      if(type==="fish"){
         score+=1;
         animateRod(150);
         navigator.vibrate?.(30);
      }else if(type==="crab"){
         score=Math.max(0,score-3);
         navigator.vibrate?.([30,30,30]);
      }else{
         score+=5;
         animateRod(250);
         navigator.vibrate?.(150);
      }

      updateScore();
      clearInterval(loop);
      item.remove();
   }

   if(y>window.innerHeight+100){
      clearInterval(loop);
      item.remove();
   }

 },16);
}

function startGame(){
 document.getElementById("startScreen").style.display="none";

 score=0;
 time=30;
 running=true;

 updateScore();
 timerText.textContent=time;

 spawnInterval=setInterval(spawnItem,700);

 timerInterval=setInterval(()=>{
   time--;
   timerText.textContent=time;
   if(time<=0) endGame();
 },1000);
}

function endGame(){
 running=false;

 clearInterval(spawnInterval);
 clearInterval(timerInterval);

 if(score>highScore){
   highScore=score;
   localStorage.setItem("sosukeHigh",highScore);
 }

 highText.textContent="🏆 "+highScore;

 document.querySelector("#startScreen h1").innerHTML=
 "終了！<br>"+score+"ポイント";

 document.getElementById("startScreen").style.display="flex";
}
</script>
</body>
</html>
